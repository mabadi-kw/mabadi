<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشفير المستخلص</title>
<style>
:root{--bg:#f4f1ea;--ink:#10213b;--navy:#0b1f3b;--gold:#b8923a;--rule:#e4ddcc;--bad:#a12a2a;--ok:#1f7a4d}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin:14px 0}
label{display:block;font-weight:700;margin:10px 0 4px}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;font-size:1rem}
button{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:1rem;cursor:pointer;margin-top:12px}
button:disabled{opacity:.4;cursor:default}
.muted{color:#5e6b80;font-size:.9rem}.bad{color:var(--bad)}.ok{color:var(--ok)}
pre{white-space:pre-wrap;background:#f8f6f0;border-radius:8px;padding:10px;font-size:.85rem;max-height:260px;overflow:auto}
a.dl{display:inline-block;margin:6px 0 0 10px;color:#1a4b8c}
</style></head><body><main>
<h1>تشفير المستخلص</h1>
<p class="muted">تعمل هذه الصفحة على جهازك وحده دون اتصال. لا يُرسل منها شيء إلى أي مكان، ولا يُحفظ الرمز.</p>
<div class="card">
<label for="f">1) ملف المستخلص (النص المكشوف)</label>
<input id="f" type="file" accept=".json,application/json">
<p id="finfo" class="muted"></p>
</div>
<div class="card">
<label for="p1">2) رمز المستخلص</label>
<input id="p1" type="password" autocomplete="new-password" placeholder="خمس كلمات أو 20 حرفًا على الأقل">
<label for="p2">أعد كتابة الرمز</label>
<input id="p2" type="password" autocomplete="new-password">
<p id="pinfo" class="muted">احفظ الرمز في مكان آمن؛ إن ضاع لا يمكن فتح الملف، ولا يستطيع أحد استعادته.</p>
</div>
<div class="card">
<button id="go" disabled>3) افحص ثم شفّر</button>
<pre id="log" hidden></pre>
<div id="out"></div>
</div>

async function gz(bytes){const s=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer());}

async function key(pass,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}

  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pass,salt,ITER),await gz(new TextEncoder().encode(JSON.stringify(obj)))));

  const k=await key(pass,salt,iter);const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,b.slice(37)));
  const raw=await gunz(pt);return JSON.parse(new TextDecoder().decode(raw));}
const hex=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
$('go').onclick=async()=>{$('go').disabled=true;$('log').textContent='';$('out').innerHTML='';
  log('الفحص: محرك الخصوصية على نص كل مبدأ…');const bad=[];
  for(const it of PLAIN.items)for(const t of it.paragraphs){const f=scan(t).filter(x=>x.level==='block');if(f.length)bad.push(it.id+' · '+f.map(x=>x.kind).join('، '));}
  if(bad.length){log('توقف التشفير: '+bad.length+' مبدأ فيه علامة بيان شخصي:\n'+bad.join('\n'));log('أرسل هذه المعرّفات إلى المكتبة، ولا تنشر شيئًا.');return;}
  log('الفحص: لا علامات. ✓');
  const groups={};for(const it of PLAIN.items)for(const b of it.branches)(groups[BR[b]||'other']=groups[BR[b]||'other']||[]).push(it);
  const pass=$('p1').value,man={format:'AMX1',kdf:'PBKDF2-SHA256',iterations:ITER,cipher:'AES-GCM-256',compression:'gzip',key_id:KEYID,generated:new Date().toISOString().slice(0,10),files:[]};
  for(const [br,its] of Object.entries(groups)){const pk={...PLAIN,pack:'extract_'+br,counts:{items:its.length,novel:its.filter(i=>i.novel).length},items:its};
    const enc=await encrypt(pk,pass);const back=await decrypt(enc.buffer,pass);if(back.items.length!==its.length)throw new Error('فشل التحقق');
    const name=`mabadi-extract_${br}_v1.0.amx`,sha=await hex(enc);man.files.push({file:name,branch:br,items:its.length,bytes:enc.length,sha256:sha});
    const a=document.createElement('a');a.className='dl';a.href=URL.createObjectURL(new Blob([enc],{type:'application/octet-stream'}));a.download=name;a.textContent='⬇ '+name+' ('+its.length+')';$('out').append(a);
    log(name+': '+its.length+' مبدأً · فُتح بالرمز للتحقق ✓');}
  const mb=new TextEncoder().encode(JSON.stringify(man,null,1));const a=document.createElement('a');a.className='dl';a.href=URL.createObjectURL(new Blob([mb],{type:'application/json'}));a.download='extract_manifest.json';a.textContent='⬇ extract_manifest.json';$('out').append(a);
  log('\nنزّل الملفات، وضعها في مجلد «مخرجات»، ثم احذف ملف النص المكشوف. لا تكتب الرمز في أي محادثة.');};
</script></main></body></html>
